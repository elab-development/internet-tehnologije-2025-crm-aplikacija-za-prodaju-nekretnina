services:
  mysql:
    image: mysql:8.0
    container_name: crmnekretnine-mysql
    environment:
      MYSQL_DATABASE: crmnekretnine
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
      args:
        APP_ENV: local
    container_name: crmnekretnine-laravel
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: crmnekretnine
      DB_USERNAME: crm
      DB_PASSWORD: crm
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"

      # FIX za "View path not found" / cache path
      VIEW_COMPILED_PATH: /var/www/storage/framework/views
    volumes:
      - ./laravel:/var/www
      - laravel_vendor:/var/www/vendor
      - laravel_storage:/var/www/storage
      - laravel_cache:/var/www/bootstrap/cache
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27-alpine
    container_name: crmnekretnine-nginx
    ports:
      - "8088:80"
    volumes:
      - ./laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel

  reactfront:
    build:
      context: ./reactfront
      dockerfile: Dockerfile
    container_name: crmnekretnine-reactfront
    ports:
      - "3008:3000"
    volumes:
      - ./reactfront:/app
      - react_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - nginx

  phpmyadmin:
    image: phpmyadmin:5
    container_name: crmnekretnine-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8089:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
  react_node_modules:
  laravel_storage:
  laravel_cache:
  laravel_vendor: